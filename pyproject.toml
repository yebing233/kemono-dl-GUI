[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kemono-dl"
version = "2025.09.14"
description = "A simple downloader for kemono/coomer using Python."
authors = [
  { name="AlphaSlayer1964" }
]
dependencies = [
  "requests>=2.32.4"
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

[tool.setuptools.packages.find]
include = ["kemono_dl", "kemono_dl_gui"]

[tool.setuptools.package-data]
kemono_dl_gui = ["static/*"]

[project.scripts]
kemono-dl = "kemono_dl.__main__:main"
kemono-dl-gui = "kemono_dl_gui.__main__:main"
